[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "satellite-methane-platform"
version = "3.0.0"
description = "Auditable batch ingestion of published Carbon Mapper methane observations"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = ["duckdb==1.4.3", "pandas==2.3.3", "pyarrow==19.0.1", "requests==2.32.5", "h3==4.3.1", "filelock==3.20.0", "folium==0.20.0", "plotly==6.3.0"]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "ruff==0.17.3"]

[project.scripts]
methane = "methane.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
[tool.setuptools.package-data]
methane = ["sql/*.sql", "assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["integration: exercises multiple components with real local storage or separate processes"]

[tool.ruff]
line-length = 120
[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82", "F401"]
