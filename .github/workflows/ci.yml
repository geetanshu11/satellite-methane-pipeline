name: offline-checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - run: python -m pip install -c requirements-lock.txt '.[dev]'
      - run: python -m ruff check src tests
      - run: python -m ruff format --check src tests
      - run: python -m pytest -q
      - run: docker compose config --quiet
      - run: docker compose build
      - run: docker compose run --rm --no-deps pipeline
      - run: docker compose run --rm --no-deps pipeline
      - name: Verify persisted history after container restart
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('reports/summary.json').read_text())
          assert result['current_observations'] == result['history_versions'] == 21329
          assert result['new'] == result['updated'] == result['removed'] == 0
          PY
